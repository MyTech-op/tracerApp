[project]
name = "seoops-backend"
version = "1.0.0"
description = "SEOOps FastAPI Backend"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic[email]>=2.6.0",
    "email-validator>=2.0.0",
    "python-multipart>=0.0.9",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.28",
    "pymysql>=1.1.0",
    "psycopg2-binary>=2.9.9",
    "alembic>=1.13.1",
    "celery>=5.3.6",
    "redis>=5.0.3",
    "beautifulsoup4>=4.12.3",
    "lxml>=5.1.0",
    "httpx>=0.27.0",
    "google-genai>=0.1.1",
    "openai>=1.14.1",
    "pytest>=8.1.1",
    "python-dotenv>=1.0.1",
    "passlib[bcrypt]>=1.7.4",
    "python-jose[cryptography]>=3.3.0",
    "stripe>=10.0.0",
    "fpdf2>=2.8.0",
    "pypdf>=4.0.0",
]

[tool.vercel]
entrypoint = "api/index.py"
